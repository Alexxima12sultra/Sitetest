<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПУЛЬС — Новини</title>

<meta name="description" content="Актуальні новини дня">

<style>
body {font-family: Arial; background:#0a0a08; color:#e8e6df; margin:0}
header {padding:10px; border-bottom:1px solid #222; display:flex; justify-content:space-between}
input {padding:6px; background:#111; color:#fff; border:1px solid #333}
.card {border:1px solid #222; padding:12px; margin:10px; cursor:pointer}
.card:hover {background:#161614}
</style>
</head>

<body>

<header>
  <div>ПУЛЬС</div>
  <input id="search" placeholder="Пошук...">
</header>

<div id="news"></div>

<script>
let newsData = [];

async function fetchNews() {
  try {
    const res = await fetch('https://newsapi.org/v2/top-headlines?country=ua&apiKey=demo');
    const data = await res.json();

    newsData = data.articles.map(a => ({
      title: a.title,
      desc: a.description || '',
      source: a.source.name
    }));

    render(newsData);
    localStorage.setItem('cache', JSON.stringify(newsData));

  } catch(e) {
    const cache = localStorage.getItem('cache');
    if (cache) {
      newsData = JSON.parse(cache);
      render(newsData);
    }
  }
}

function render(data) {
  const el = document.getElementById('news');
  el.innerHTML = data.map(n => `
    <div class="card">
      <h3>${n.title}</h3>
      <p>${n.desc}</p>
      <small>${n.source}</small>
    </div>
  `).join('');
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const filtered = newsData.filter(n => n.title.toLowerCase().includes(q));
  render(filtered);
});

fetchNews();
</script>

</body>
</html>
